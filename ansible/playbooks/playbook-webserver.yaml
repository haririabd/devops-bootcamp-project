- name: Deploy container to webserver
  hosts: webserver
  become: true
  vars:
    ecr_registry: "739951718815.dkr.ecr.ap-southeast-1.amazonaws.com"
    ecr_repo: "devops-bootcamp/final-project-haririabd"
    image_tag: "latest"
    container_name: "final-haririabd"

  roles:
    - geerlingguy.docker

  tasks:
    - name: Ensure unzip is present
      apt:
        name: unzip
        state: present
        update_cache: yes

    - name: Download AWS CLI v2 installer
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip

    - name: Unzip AWS CLI v2 installer
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
        creates: /tmp/aws/install

    - name: Install AWS CLI v2
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

    - name: Login to ECR
      shell: >
        aws ecr get-login-password --region ap-southeast-1
        | docker login --username AWS --password-stdin {{ ecr_registry }}

    - name: Remove existing container if present
      command: docker rm -f {{ container_name }}
      ignore_errors: true

    - name: Run the final-project container
      command: >
        docker run -d --name {{ container_name }}
        --restart always
        -p 80:80
        {{ ecr_registry }}/{{ ecr_repo }}:{{ image_tag }}
